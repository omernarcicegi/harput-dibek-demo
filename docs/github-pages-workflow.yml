name: GitHub Pages'e yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayın çalışsın; sıradaki beklesin.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ucuncu-fincan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ucuncu-fincan/package-lock.json

      - run: npm ci

      - name: Testler
        run: npm test -- --run

      - name: Derle
        # Pages alt dizinde sunar: /<depo-adı>/
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - name: SPA geri dönüşü
        # Pages'te rewrite yok; /admin gibi derin bağlantılar 404'e düşer.
        # 404.html olarak index'i koyunca uygulama yine açılır.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ucuncu-fincan/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
